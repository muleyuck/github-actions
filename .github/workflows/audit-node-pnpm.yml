name: audit-node-pnpm

on:
  workflow_call:
    inputs:
      audit-level:
        description: "Lowest severity that fails the check"
        type: string
        required: false
        default: "high"

permissions: {}
defaults:
  run:
    shell: bash

jobs:
  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: muleyuck/github-actions/actions/node/setup@v1

      - name: Run pnpm audit
        env:
          AUDIT_LEVEL: ${{ inputs.audit-level }}
        run: pnpm audit --audit-level "$AUDIT_LEVEL"

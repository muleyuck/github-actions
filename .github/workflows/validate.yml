name: validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: {}
defaults:
  run:
    shell: bash
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Run actionlint
        run: actionlint -color

  action-refs:
    name: action references
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assert shared action references
        run: ./tests/assert-action-refs.sh

  fixture-rust:
    name: fixture (rust)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./actions/rust/setup
        with:
          working-directory: tests/fixtures/rust
      - name: Assert the toolchain is usable
        working-directory: tests/fixtures/rust
        run: |
          command -v cargo
          make test

  fixture-lua-neovim:
    name: fixture (lua-neovim)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./actions/lua/luacheck
        with:
          working-directory: tests/fixtures/lua-neovim
          paths: lua/

      - uses: ./actions/lua/stylua
        with:
          paths: tests/fixtures/lua-neovim/lua/
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./actions/lua/setup-neovim

      - name: Assert Neovim can load the fixture plugin
        working-directory: tests/fixtures/lua-neovim
        run: make test

  fixture-node-pnpm:
    name: fixture (node-pnpm)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./actions/node/setup
        with:
          working-directory: tests/fixtures/node-pnpm
      - name: Assert node and pnpm are usable
        working-directory: tests/fixtures/node-pnpm
        run: |
          command -v node
          command -v pnpm
          test -d node_modules
          make test

  fixture-go:
    name: fixture (go)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./actions/go/setup
        with:
          working-directory: tests/fixtures/go
      - name: Assert the Go toolchain is usable
        working-directory: tests/fixtures/go
        run: |
          command -v go
          command -v golangci-lint
          make test

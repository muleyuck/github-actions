name: rust-setup
description: 'Install the Rust toolchain from mise.toml and restore the cargo cache'

inputs:
  install-args:
    description: 'Arguments passed to `mise install`. Defaults to rust only, so slow-to-build tools such as cargo-dist are skipped'
    required: false
    default: 'rust'
  working-directory:
    description: 'Directory that holds mise.toml'
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      with:
        install_args: ${{ inputs.install-args }}
        working_directory: ${{ inputs.working-directory }}

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

name: rust-setup
description: "Install the Rust toolchain from mise.toml and restore the cargo cache"

inputs:
  install-args:
    description: "Arguments passed to `mise install`. Defaults to rust only, so slow-to-build tools such as cargo-dist are skipped"
    required: false
    default: "rust"
  working-directory:
    description: "Directory that holds mise.toml"
    required: false
    default: "."

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      with:
        install_args: ${{ inputs.install-args }}
        working_directory: ${{ inputs.working-directory }}

    # target/ holds paths and objects from the runner image's toolchain (an Xcode path in
    # ort-sys's link flags, C objects built for the SDK's macOS), so each image OS release
    # (ImageOS: macos15, ubuntu24, ...) and architecture gets its own cache. ImageOS is a
    # GitHub-hosted runner variable, not in the env context; elsewhere the key uses "unknown".
    - id: image
      shell: bash
      run: echo "name=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.name }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.name }}-cargo-

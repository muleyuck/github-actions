name: node-setup
description: "Install Node.js and pnpm from mise.toml, cache the pnpm store and install dependencies"

inputs:
  install-args:
    description: "Arguments passed to `mise install`"
    required: false
    default: "node pnpm"
  working-directory:
    description: "Directory that holds mise.toml and pnpm-lock.yaml"
    required: false
    default: "."

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      with:
        install_args: ${{ inputs.install-args }}
        working_directory: ${{ inputs.working-directory }}

    - name: Resolve pnpm store directory
      id: pnpm-store
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm install --frozen-lockfile

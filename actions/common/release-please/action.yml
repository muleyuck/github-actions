name: release-please
description: "Create the release PR and tag the release with release-please"

inputs:
  token:
    description: "GitHub token used by release-please"
    required: true
  config-file:
    description: "Path to the release-please config file"
    required: false
    default: ".github/release-please-config.json"
  manifest-file:
    description: "Path to the release-please manifest file"
    required: false
    default: ".github/.release-please-manifest.json"
  path:
    description: "Path of the released package in the config. release-please prefixes its outputs with it unless it is the root"
    required: false
    default: "."

outputs:
  release_created:
    description: "true when a release was created"
    value: ${{ inputs.path == '.' && steps.release.outputs.release_created || steps.release.outputs[format('{0}--release_created', inputs.path)] }}
  tag_name:
    description: "Name of the created tag"
    value: ${{ inputs.path == '.' && steps.release.outputs.tag_name || steps.release.outputs[format('{0}--tag_name', inputs.path)] }}
  version:
    description: "Version that was released"
    value: ${{ inputs.path == '.' && steps.release.outputs.version || steps.release.outputs[format('{0}--version', inputs.path)] }}
  sha:
    description: "Commit SHA the release points at"
    value: ${{ inputs.path == '.' && steps.release.outputs.sha || steps.release.outputs[format('{0}--sha', inputs.path)] }}

runs:
  using: composite
  steps:
    - id: release
      uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
      with:
        token: ${{ inputs.token }}
        config-file: ${{ inputs.config-file }}
        manifest-file: ${{ inputs.manifest-file }}

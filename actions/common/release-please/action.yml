name: release-please
description: 'Create the release PR and tag the release with release-please'

inputs:
  token:
    description: 'GitHub token used by release-please'
    required: true
  config-file:
    description: 'Path to the release-please config file'
    required: false
    default: '.github/release-please-config.json'
  manifest-file:
    description: 'Path to the release-please manifest file'
    required: false
    default: '.github/.release-please-manifest.json'

outputs:
  release_created:
    description: 'true when a release was created'
    value: ${{ steps.release.outputs.release_created }}
  tag_name:
    description: 'Name of the created tag'
    value: ${{ steps.release.outputs.tag_name }}
  version:
    description: 'Version that was released'
    value: ${{ steps.release.outputs.version }}
  sha:
    description: 'Commit SHA the release points at'
    value: ${{ steps.release.outputs.sha }}

runs:
  using: composite
  steps:
    - id: release
      uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
      with:
        token: ${{ inputs.token }}
        config-file: ${{ inputs.config-file }}
        manifest-file: ${{ inputs.manifest-file }}

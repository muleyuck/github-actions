name: setup-neovim
description: 'Install Neovim for running the test suite'

inputs:
  version:
    description: 'Version of Neovim to install'
    required: false
    default: 'stable'

runs:
  using: composite
  steps:
    - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.4.2
      with:
        neovim: true
        version: ${{ inputs.version }}

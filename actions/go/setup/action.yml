name: go-setup
description: "Install Go and golangci-lint from mise.toml and restore the module and build caches"

inputs:
  install-args:
    description: "Arguments passed to `mise install`. Defaults to go and golangci-lint only"
    required: false
    default: "go golangci-lint"
  working-directory:
    description: "Directory that holds mise.toml and go.mod"
    required: false
    default: "."

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      with:
        install_args: ${{ inputs.install-args }}
        working_directory: ${{ inputs.working-directory }}

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download modules
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: go mod download
